spring.application.name=backend

server.port=8000
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}

spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET}
spring.security.oauth2.client.registration.github.scope=user:email

jwt.secret=${JWT_SECRET}
app.frontend-url=http://localhost:5173

# default is 1MB/10MB, too small for PDF document uploads
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# pay attention to what container you target
spring.datasource.url=jdbc:postgresql://pgvector:5432/postgres
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Flyway owns the schema; Hibernate only checks that the entities match it.
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
# stamps a pre-existing (Hibernate-built) database at V1 instead of rebuilding it
spring.flyway.baseline-on-migrate=true
# role passwords are injected into V2 rather than hardcoded; Flyway checksums the raw file,
# so rotating a password does not invalidate the applied migration
spring.flyway.placeholders[plebian_password]=${POSTGRES_PLEBIAN_PASSWORD}
spring.flyway.placeholders[eques_password]=${POSTGRES_EQUES_PASSWORD}
spring.flyway.placeholders[patrician_password]=${POSTGRES_PATRICIAN_PASSWORD}
# Corpus access runs as one Postgres role per clearance so RLS, not Java, decides visibility.
app.corpus.plebian-password=${POSTGRES_PLEBIAN_PASSWORD}
app.corpus.eques-password=${POSTGRES_EQUES_PASSWORD}
app.corpus.patrician-password=${POSTGRES_PATRICIAN_PASSWORD}
# three pools of this size plus the application pool must stay under Postgres max_connections
app.corpus.pool-size=5

spring.jpa.show-sql=true
# VectorDatabase declares the VectorStore bean explicitly against the clearance-routed template,
# so Spring AI's autoconfiguration is excluded rather than silently overridden — with two
# JdbcTemplates present it cannot pick one anyway.
spring.autoconfigure.exclude=org.springframework.ai.vectorstore.pgvector.autoconfigure.PgVectorStoreAutoConfiguration
spring.ai.openai.api-key=${OPENAI_API_KEY}
# to select model of embeding(how embeding appears)
spring.ai.openai.embedding.options.model=text-embedding-ada-002
# vector_store's schema is owned by Flyway (V1__baseline.sql); dimensions are set on the builder
# in VectorDatabase. The spring.ai.vectorstore.pgvector.* properties are inert now that the
# autoconfiguration is excluded, so they are gone rather than misleading.
